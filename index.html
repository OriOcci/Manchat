<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>만찾, 서만창 도서 검색 시스템</title>

<!-- 웹 브라우저 파비콘 -->
<link rel="icon" href="favicon.png" type="image/png">

<!-- iOS 홈 화면 아이콘 (180x180 규격) -->
<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png">

<!-- PWA Manifest 연결 -->
<link rel="manifest" href="/manifest.json">

<!-- iOS 전용 PWA (웹앱) 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="만찾">

<!-- Gothic A1 웹폰트 로드 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--txt:#e8eaed;--sub:#98a1b3;--acc:#5b8cff;--acc2:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Gothic A1',-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
header{position:sticky;top:0;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 16px 12px;z-index:10}
.wrap{max-width:980px;margin:0 auto}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:19px;letter-spacing:-.3px}
h1 span{color:var(--sub);font-size:13px;font-weight:400;margin-left:8px}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--acc)}
.btn.ghost{color:var(--sub)}
.btn.lucky{background:rgba(91,140,255,.1);border-color:var(--acc);color:var(--acc);font-weight:600;white-space:nowrap}
.btn.lucky:hover{background:var(--acc);color:#fff}

/* 검색바 레이아웃 구조 */
.searchbar{display:flex;flex-direction:column;gap:8px}
.search-top-row{display:flex;gap:8px;width:100%}
input[type=search]{flex:1;min-width:0;padding:12px 14px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);outline:none;font-family:inherit}
input[type=search]:focus{border-color:var(--acc)}

/* 정렬 영역 레이아웃 (라벨 + 드롭다운) */
.sort-container{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);font-weight:600}
select{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px;font-family:inherit}

main{max-width:980px;margin:0 auto;padding:16px}
.src{font-size:12px;color:var(--sub);margin-bottom:10px}
.src b{color:var(--acc2)}
.stat{color:var(--sub);font-size:13px;margin:4px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;color:var(--sub);font-size:12px;font-weight:600;background:var(--bg)}
tr.clickable-row{cursor:pointer;transition:background .15s}
tr.clickable-row:hover td{background:#151923}
.loc{display:inline-block;padding:3px 9px;border-radius:6px;background:#1d2a1f;color:var(--acc2);font-weight:700;font-size:12px;letter-spacing:.5px}
mark{background:#3b4a7a;color:#fff;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--sub);padding:48px 0;line-height:1.6}
.partial-btn{margin-top:12px;padding:8px 16px;border-radius:8px;border:1px solid var(--acc);background:rgba(91,140,255,.1);color:var(--acc);font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
.partial-btn:hover{background:var(--acc);color:#fff}
.more{display:block;width:100%;margin:16px 0 40px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-size:14px;font-family:inherit}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e2432;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:100}
.toast.on{opacity:1}

/* 개발자 전용 검색 안내 배너 */
.dev-banner{background:rgba(91,140,255,.08);border:1px solid var(--acc);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dev-banner-text{font-size:14px;color:var(--txt);font-weight:600}
.dev-banner-btn{padding:8px 14px;border-radius:8px;border:none;background:var(--acc);color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;font-family:inherit}
.dev-banner-btn:hover{opacity:.9}

/* 모달 공통 스타일 */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:92%;max-width:540px;padding:24px;position:relative;box-shadow:0 20px 40px rgba(0,0,0,.5);transform:translateY(10px);transition:transform .2s ease;max-height:90vh;overflow-y:auto}
.modal-overlay.active .modal{transform:translateY(0)}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;font-family:inherit}
.modal-close:hover{color:var(--txt);background:var(--line)}

/* 개발자 모달 전용 스타일 */
.dev-modal{max-width:440px}
.dev-header{font-size:18px;font-weight:700;color:var(--txt);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.dev-body{display:flex;flex-direction:column;gap:10px}
.dev-menu-btn{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:#101216;color:var(--txt);font-size:14px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s;font-family:inherit}
.dev-menu-btn:hover{border-color:var(--acc)}
.dev-info-box{background:#101216;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--sub);display:none;margin-top:-2px}
.dev-sub-box{background:#101216;border:1px solid var(--line);border-radius:10px;padding:10px;display:none;margin-top:-2px;gap:8px;flex-direction:column}
.dev-sub-btn{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;text-align:left;cursor:pointer;transition:border-color .15s;font-family:inherit}
.dev-sub-btn:hover{border-color:var(--acc);color:var(--acc)}
.dev-footer{margin-top:20px;display:flex;justify-content:flex-end}

/* 공지사항 모달 전용 스타일 */
.notice-modal{max-width:480px}
.notice-header{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:var(--txt);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.notice-body{font-size:14px;color:#c0c6d4;line-height:1.6;white-space:pre-line;max-height:300px;overflow-y:auto;padding-right:4px}
.notice-footer{margin-top:20px;display:flex;justify-content:flex-end}
.notice-btn{padding:8px 16px;border-radius:8px;border:none;background:var(--acc);color:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.notice-btn:hover{opacity:.9}

/* 도서 상세 모달 스타일 */
.modal-body{display:flex;gap:20px;margin-top:8px}
.cover-box{width:110px;height:160px;background:#101216;border:1px solid var(--line);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.cover-box img{width:100%;height:100%;object-fit:cover;display:none}
.cover-box img.loaded{display:block}
.cover-placeholder{color:var(--sub);font-size:11px;text-align:center;padding:8px}
.modal-info{flex:1;display:flex;flex-direction:column;gap:8px}
.modal-title{font-size:16px;font-weight:700;line-height:1.4;margin:0;color:var(--txt)}
.info-item{font-size:13px;color:var(--sub)}
.info-item strong{color:var(--txt);font-weight:600;display:inline-block;width:50px}

/* 도서 상세 세부 영역 (태그, 한마디, 도서 소개) */
.summary-section{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.summary-title{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px}
.summary-content{font-size:13px;color:#c0c6d4;line-height:1.5;max-height:90px;overflow-y:auto;white-space:pre-line;background:#101216;padding:8px 12px;border-radius:6px;border:1px solid var(--line)}

/* 책장 시각화 영역 (반응형 최적화) */
.shelf-section{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.shelf-title{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.shelf-title span{color:var(--acc2);font-weight:700}

.shelf-grid{
  display:grid;
  grid-template-columns:repeat(6, 1fr);
  gap:3px;
  background:#101216;
  padding:6px;
  border-radius:8px;
  border:1px solid var(--line);
  width:100%;
  overflow-x:auto;
}
.shelf-cell{
  aspect-ratio:3.5/1;
  background:#1a1e28;
  border:1px solid #282e3d;
  border-radius:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  color:#576071;
  font-weight:600;
  transition:all .2s ease;
  min-width:0;
}
.shelf-cell.active{background:var(--acc2);color:#000;border-color:var(--acc2);font-weight:800;box-shadow:0 0 6px rgba(34,197,94,.5);transform:scale(1.05);z-index:1}

@media(max-width:560px){
  .hide-sm{display:none}
  .modal{padding:16px}
  .modal-body{flex-direction:column;align-items:center}
  .modal-info{width:100%}
  
  .shelf-grid{padding:4px;gap:2px}
  .shelf-cell{font-size:8px;aspect-ratio:3/1}
}
</style>
</head>
<body>
<header><div class="wrap">
<div class="titlerow">
  <h1>📚 만찾<span>서만창 도서 검색 시스템</span></h1>
  <div>
    <button class="btn ghost" id="resetBtn" hidden>↩ 기본 데이터로</button>
  </div>
</div>
<div class="searchbar">
  <form class="search-top-row" id="searchForm" action="javascript:void(0);">
    <input id="q" type="search" placeholder="도서 검색" autocomplete="off" enterkeyhint="search">
    <button type="button" class="btn lucky" id="luckyBtn">🎲 I'm Feeling Lucky</button>
  </form>
  <div class="sort-container">
    <span>정렬 순서:</span>
    <select id="sort">
      <option value="title" selected>도서명</option>
      <option value="loc">위치</option>
      <option value="author">저자</option>
    </select>
  </div>
</div>
</div></header>
<main>
  <!-- 개발자 전용 검색 안내 배너 -->
  <div class="dev-banner" id="devBanner" style="display:none">
    <div class="dev-banner-text">🛠️ 개발자 전용 모드에 접근할 수 있습니다.</div>
    <button class="dev-banner-btn" id="openDevModalBtn">개발자 메뉴 열기</button>
  </div>

  <div class="src" id="src"></div>
  <div class="stat" id="stat"></div>
  <table><thead><tr><th style="width:44%">도서명</th><th class="hide-sm">저자</th><th class="hide-sm">출판사</th><th style="width:90px">위치</th></tr></thead>
  <tbody id="rows"></tbody></table>
  <div class="empty" id="empty" hidden></div>
  <button class="more" id="more" hidden>더 보기</button>
</main>
<div class="toast" id="toast"></div>

<!-- 개발자 전용 모달 -->
<div class="modal-overlay" id="devOverlay">
  <div class="modal dev-modal">
    <button class="modal-close" id="devClose">✕</button>
    <div class="dev-header">⚙️ 개발자 메뉴</div>
    <div class="dev-body">
      <!-- 1. 업로드 -->
      <button class="dev-menu-btn" id="devUploadBtn">
        <span>📁 데이터 수동 업로드 (*.csv)</span>
        <span style="font-size:12px; color:var(--sub)">선택</span>
      </button>
      <input type="file" id="devFileInput" accept=".csv,text/csv" hidden>

      <!-- 2. 버전 정보 -->
      <button class="dev-menu-btn" id="devVersionToggleBtn">
        <span>ℹ️ 버전 정보</span>
        <span style="font-size:12px; color:var(--sub)" id="devVersionArrow">▼</span>
      </button>
      <div class="dev-info-box" id="devVersionBox">v2026.09.15, 2026년 8월 22일 개발 시작</div>

      <!-- 3. 기타 (이스터에그) -->
      <button class="dev-menu-btn" id="devEtcToggleBtn">
        <span>⚙️ 기타</span>
        <span style="font-size:12px; color:var(--sub)" id="devEtcArrow">▼</span>
      </button>
      <div class="dev-sub-box" id="devEtcBox">
        <button class="dev-sub-btn" id="easterEgg1Btn">🐣 Easter Egg #1</button>
      </div>
    </div>
    <div class="dev-footer">
      <button class="btn" id="devModalCloseBtn">닫기</button>
    </div>
  </div>
</div>

<!-- 공지사항 팝업 모달 -->
<div class="modal-overlay" id="noticeOverlay">
  <div class="modal notice-modal">
    <button class="modal-close" id="noticeClose">✕</button>
    <div class="notice-header">📢 공지사항</div>
    <div class="notice-body" id="noticeBody"></div>
    <div class="notice-footer">
      <button class="notice-btn" id="noticeConfirm">확인</button>
    </div>
  </div>
</div>

<!-- 도서 상세 정보 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-body">
      <div class="cover-box">
        <span class="cover-placeholder" id="coverLoading">표지 불러오는 중...</span>
        <img id="coverImg" alt="책 표지">
      </div>
      <div class="modal-info">
        <h2 class="modal-title" id="mTitle">-</h2>
        <div class="info-item"><strong>저자</strong> <span id="mAuthor">-</span></div>
        <div class="info-item"><strong>출판사</strong> <span id="mPublisher">-</span></div>
        <div class="info-item" style="margin-top:auto"><strong>위치</strong> <span class="loc" id="mLoc">-</span></div>
      </div>
    </div>
    
    <!-- 태그 영역 -->
    <div class="summary-section" id="tagSection" style="display:none">
      <div class="summary-title">🏷️ 태그</div>
      <div class="summary-content" id="mTag"></div>
    </div>

    <!-- 한마디 영역 -->
    <div class="summary-section" id="wordsSection" style="display:none">
      <div class="summary-title">💬 한마디</div>
      <div class="summary-content" id="mWords"></div>
    </div>

    <!-- 도서 소개 영역 -->
    <div class="summary-section">
      <div class="summary-title">📖 도서 소개</div>
      <div class="summary-content" id="mSummary">도서 정보를 불러오는 중...</div>
    </div>

    <!-- 책장 위치 시각화 영역 -->
    <div class="shelf-section">
      <div class="shelf-title">
        <span>📍 서가 위치 안내</span>
        <span id="shelfTargetLabel">-</span>
      </div>
      <div class="shelf-grid" id="shelfGrid"></div>
    </div>
  </div>
</div>

<script>
let currentData = [];
let filteredData = [];
let displayCount = 50;
let currentHighlightTerms = [];

// API 호출 결과 캐시 (메모리 최적화)
const bookApiCache = new Map();

async function checkNotice() {
  try {
    const res = await fetch('notice.txt');
    if (!res.ok) return;
    const text = await res.text();
    
    if (text && text.trim().length > 0) {
      document.getElementById('noticeBody').innerText = text.trim();
      document.getElementById('noticeOverlay').classList.add('active');
    }
  } catch (err) {}
}

function closeNotice() {
  document.getElementById('noticeOverlay').classList.remove('active');
}

document.getElementById('noticeClose').onclick = closeNotice;
document.getElementById('noticeConfirm').onclick = closeNotice;
document.getElementById('noticeOverlay').onclick = (e) => {
  if (e.target.id === 'noticeOverlay') closeNotice();
};

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length === 0) return [];

  const rawRows = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) continue;

    const row = [];
    let insideQuote = false;
    let entry = '';

    for (let j = 0; j < line.length; j++) {
      const char = line[j];
      if (char === '"') {
        if (insideQuote && line[j + 1] === '"') {
          entry += '"';
          j++;
        } else {
          insideQuote = !insideQuote;
        }
      } else if (char === ',' && !insideQuote) {
        row.push(entry.trim().replace(/^"|"$/g, ''));
        entry = '';
      } else {
        entry += char;
      }
    }
    row.push(entry.trim().replace(/^"|"$/g, ''));
    rawRows.push(row);
  }

  if (rawRows.length === 0) return [];

  // 컬럼 인덱스 맵핑
  const colMap = {
    title: 0,
    author: 1,
    series: 2,
    missing: 3,
    tag: 4,
    words: 5,
    comment: 6,
    publisher: -1,
    loc: -1
  };

  const headerRow = rawRows[0].map(c => c.toLowerCase().trim());
  const isHeader = headerRow.some(c => 
    ['title', '제목', '도서명', 'author', '저자', 'series', '시리즈', 'missing', '결권', 'tag', '태그', 'words', '정보'].includes(c)
  );

  let startIndex = 0;
  if (isHeader) {
    startIndex = 1;
    headerRow.forEach((col, idx) => {
      if (['title', '제목', '도서명'].includes(col)) colMap.title = idx;
      else if (['author', '저자', '지은이'].includes(col)) colMap.author = idx;
      else if (['series', '시리즈', '총권수'].includes(col)) colMap.series = idx;
      else if (['missing', '결권', '미싱', '없는권수'].includes(col)) colMap.missing = idx;
      else if (['tag', 'tags', '태그', '해시태그'].includes(col)) colMap.tag = idx;
      else if (['words', 'word', '정보', '도서소개', '소개'].includes(col)) colMap.words = idx;
      else if (['publisher', '출판사'].includes(col)) colMap.publisher = idx;
      else if (['loc', 'location', '위치', '서가'].includes(col)) colMap.loc = idx;
      else if (['comment', '주석', '메모'].includes(col)) colMap.comment = idx;
    });
  }

  function parseMissingSet(str) {
    const set = new Set();
    if (!str) return set;
    const parts = str.toString().split(/[,;\s]+/);
    for (const p of parts) {
      const trimmed = p.trim();
      if (!trimmed) continue;
      if (trimmed.includes('~') || trimmed.includes('-')) {
        const range = trimmed.split(/[-~]/).map(n => parseInt(n.trim(), 10));
        if (range.length === 2 && !isNaN(range[0]) && !isNaN(range[1])) {
          const min = Math.min(range[0], range[1]);
          const max = Math.max(range[0], range[1]);
          for (let k = min; k <= max; k++) set.add(k);
        }
      } else {
        const val = parseInt(trimmed, 10);
        if (!isNaN(val)) set.add(val);
      }
    }
    return set;
  }

  const result = [];

  for (let i = startIndex; i < rawRows.length; i++) {
    const row = rawRows[i];
    const baseTitle = row[colMap.title] || '';
    if (!baseTitle) continue;

    const author = row[colMap.author] || '';
    const seriesRaw = colMap.series !== -1 ? row[colMap.series] : '1';
    const missingRaw = colMap.missing !== -1 ? row[colMap.missing] : '';
    const tag = colMap.tag !== -1 ? (row[colMap.tag] || '') : '';
    const words = colMap.words !== -1 ? (row[colMap.words] || '') : '';
    const publisher = colMap.publisher !== -1 ? (row[colMap.publisher] || '-') : '-';
    const loc = colMap.loc !== -1 ? (row[colMap.loc] || '-') : '-';

    let seriesCount = parseInt(seriesRaw, 10);
    if (isNaN(seriesCount) || seriesCount < 1) seriesCount = 1;

    const missingSet = parseMissingSet(missingRaw);

    if (seriesCount > 1) {
      for (let vol = 1; vol <= seriesCount; vol++) {
        if (missingSet.has(vol)) continue;
        const volTitle = `${baseTitle} (${vol})`;
        result.push([volTitle, author, publisher, loc, tag, words]);
      }
    } else {
      if (!missingSet.has(1)) {
        result.push([baseTitle, author, publisher, loc, tag, words]);
      }
    }
  }

  return result;
}

async function loadDefaultCSV() {

function showToast(msg) {

function getSubstrings(str) {
  const clean = str.replace(/\s+/g, '');
  const chunks = new Set();
  const minLen = clean.length >= 4 ? 2 : Math.max(2, clean.length - 1);
  
  for (let len = clean.length - 1; len >= minLen; len--) {
    for (let i = 0; i <= clean.length - len; i++) {
      chunks.add(clean.substring(i, i + len));
    }
  }
  return Array.from(chunks);
}

function filterAndRender(isPartialMode = false) {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const sort = document.getElementById('sort').value;
  const devBanner = document.getElementById('devBanner');

  if (q === '개발자') {
    devBanner.style.display = 'flex';
  } else {
    devBanner.style.display = 'none';
  }

  currentHighlightTerms = [];

  if (!q) {
    // 검색어가 입력되지 않은 경우 결과 목록을 비움
    filteredData = [];
  } else if (!isPartialMode) {
    currentHighlightTerms = [q];
    filteredData = currentData.filter(row => {
      return row.some(cell => cell && cell.toLowerCase().includes(q));
    });
  } else {
    const subTerms = getSubstrings(q);
    currentHighlightTerms = subTerms.length > 0 ? subTerms : [q];

    filteredData = currentData.filter(row => {
      return row.some(cell => {
        if (!cell) return false;
        const lowerCell = cell.toLowerCase();
        return subTerms.some(term => lowerCell.includes(term));
      });
    });
  }

  filteredData.sort((a, b) => {
    const opts = { numeric: true, sensitivity: 'base' };
    if (sort === 'loc') return (a[3] || '').localeCompare(b[3] || '', 'ko', opts);
    if (sort === 'title') return (a[0] || '').localeCompare(b[0] || '', 'ko', opts);
    if (sort === 'author') return (a[1] || '').localeCompare(b[1] || '', 'ko', opts);
    return 0;
  });

  displayCount = 50;
  renderTable(isPartialMode);
}

function renderTable(isPartialMode = false) {
  const rowsEl = document.getElementById('rows');
  const statEl = document.getElementById('stat');
  const emptyEl = document.getElementById('empty');
  const moreBtn = document.getElementById('more');
  const tableEl = document.querySelector('table');
  const q = document.getElementById('q').value.trim();

  // 검색어가 없을 경우 테이블을 숨기고 "환영합니다" 표시
  if (!q) {
    if (tableEl) tableEl.style.display = 'none';
    statEl.innerText = '';
    rowsEl.innerHTML = '';
    emptyEl.hidden = false;
    moreBtn.hidden = true;
    emptyEl.innerHTML = '<div style="font-size:18px; font-weight:600; color:var(--sub); padding:80px 0;">환영합니다</div>';
    return;
  }

  // 검색어가 있을 경우 테이블 출력
  if (tableEl) tableEl.style.display = '';
  statEl.innerText = `검색 결과: ${filteredData.length}건`;

  if (filteredData.length === 0) {
    rowsEl.innerHTML = '';
    emptyEl.hidden = false;
    moreBtn.hidden = true;

    if (q && !isPartialMode && q.length >= 2) {
      emptyEl.innerHTML = `
        검색 결과가 없습니다.<br>
        <span style="font-size:13px; color:var(--sub);">일부 일치하는 경우도 검색할까요?</span><br>
        <button class="partial-btn" onclick="filterAndRender(true)">일부 일치 검색 실행</button>
      `;
    } else {
      emptyEl.innerHTML = '검색 결과가 없습니다.';
    }
    return;
  }

  emptyEl.hidden = true;
  const slice = filteredData.slice(0, displayCount);

  const highlight = (text) => {
    if (!text) return '';
    if (!currentHighlightTerms || currentHighlightTerms.length === 0) return text;
    const sortedTerms = [...currentHighlightTerms].sort((a, b) => b.length - a.length);
    const pattern = sortedTerms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
    if (!pattern) return text;
    const reg = new RegExp(`(${pattern})`, 'gi');
    return text.replace(reg, '<mark>$1</mark>');
  };

  rowsEl.innerHTML = slice.map((row, index) => `
    <tr class="clickable-row" onclick="openModal(${index})">
      <td>${highlight(row[0])}</td>
      <td class="hide-sm">${highlight(row[1])}</td>
      <td class="hide-sm">${highlight(row[2])}</td>
      <td><span class="loc">${highlight(row[3])}</span></td>
    </tr>
  `).join('');

  moreBtn.hidden = displayCount >= filteredData.length;
}

function parseLocationTargets(locStr) {
  if (!locStr) return [];
  const targets = new Set();
  const cleanStr = locStr.toUpperCase().trim();
  const parts = cleanStr.split(/[\s,]+/);

  parts.forEach(part => {
    const rangeMatch = part.match(/^([A-F])(\d+)[-~]([A-F])?(\d+)$/);
    if (rangeMatch) {
      const startCol = rangeMatch[1];
      const startRow = parseInt(rangeMatch[2], 10);
      const endCol = rangeMatch[3] || startCol;
      const endRow = parseInt(rangeMatch[4], 10);

      const colStartIdx = startCol.charCodeAt(0);
      const colEndIdx = endCol.charCodeAt(0);

      for (let c = colStartIdx; c <= colEndIdx; c++) {
        const colChar = String.fromCharCode(c);
        const rMin = Math.min(startRow, endRow);
        const rMax = Math.max(startRow, endRow);
        for (let r = rMin; r <= rMax; r++) {
          if (r >= 1 && r <= 8) {
            targets.add(`${colChar}${r}`);
          }
        }
      }
    } else {
      const singleMatch = part.match(/([A-F])(\d+)/);
      if (singleMatch) {
        const col = singleMatch[1];
        const row = parseInt(singleMatch[2], 10);
        if (row >= 1 && row <= 8) {
          targets.add(`${col}${row}`);
        }
      }
    }
  });

  return Array.from(targets);
}

function renderShelfGrid(activeLocStr) {
  const gridEl = document.getElementById('shelfGrid');
  const targetLabel = document.getElementById('shelfTargetLabel');
  gridEl.innerHTML = '';

  const activeTargets = parseLocationTargets(activeLocStr);
  targetLabel.innerText = activeTargets.length > 0 ? activeTargets.join(', ') : activeLocStr;

  const cols = ['A', 'B', 'C', 'D', 'E', 'F'];

  for (let r = 1; r <= 8; r++) {
    for (let c = 0; c < cols.length; c++) {
      const cellId = `${cols[c]}${r}`;
      const cell = document.createElement('div');
      cell.className = 'shelf-cell';
      cell.innerText = cellId;

      if (activeTargets.includes(cellId)) {
        cell.classList.add('active');
      }

      gridEl.appendChild(cell);
    }
  }
}

async function fetchKakaoBookData(query) {
  const cacheKey = query.trim().toLowerCase();
  if (bookApiCache.has(cacheKey)) {
    return bookApiCache.get(cacheKey);
  }

  try {
    const url = `/api/book?query=${encodeURIComponent(query)}`;
    const res = await fetch(url);

    if (!res.ok) return null;
    const data = await res.json();

    if (data.documents && data.documents.length > 0) {
      const doc = data.documents[0];
      const result = {
        thumbnail: doc.thumbnail || null,
        contents: doc.contents || null
      };
      bookApiCache.set(cacheKey, result);
      return result;
    }
  } catch (e) {
    console.error("API 로드 에러:", e);
  }
  return null;
}

async function openModal(index) {
  const book = filteredData[index];
  if (!book) return;

  const title = book[0];
  const author = book[1];
  const publisher = book[2];
  const loc = book[3];
  const tag = book[4] || '';
  const words = book[5] || '';

  document.getElementById('mTitle').innerText = title;
  document.getElementById('mAuthor').innerText = author || '-';
  document.getElementById('mPublisher').innerText = publisher || '-';
  document.getElementById('mLoc').innerText = loc || '-';

  renderShelfGrid(loc);

  const imgEl = document.getElementById('coverImg');
  const loadingEl = document.getElementById('coverLoading');
  const summaryEl = document.getElementById('mSummary');
  const tagSection = document.getElementById('tagSection');
  const tagEl = document.getElementById('mTag');
  const wordsSection = document.getElementById('wordsSection');
  const wordsEl = document.getElementById('mWords');
  
  imgEl.classList.remove('loaded');
  imgEl.src = '';
  loadingEl.innerText = '표지 불러오는 중...';
  loadingEl.style.display = 'block';
  summaryEl.innerText = '도서 정보를 불러오는 중...';

  if (tag && tag.trim().length > 0) {
    const formattedTags = tag.split(/[,;\s]+/)
      .filter(t => t.trim().length > 0)
      .map(t => t.startsWith('#') ? t : '#' + t)
      .join(' ');
    tagEl.innerText = formattedTags;
    tagSection.style.display = 'block';
  } else {
    tagSection.style.display = 'none';
  }

  if (words && words.trim().length > 0) {
    wordsEl.innerText = words.trim();
    wordsSection.style.display = 'block';
  } else {
    wordsSection.style.display = 'none';
  }

  document.getElementById('modalOverlay').classList.add('active');

  let formattedTitle = title
    .replace(/[\(\[\{]\s*0*(\d+)\s*[\)\]\}]/g, ' $1권 ')
    .replace(/\([^\d]*?\)/g, '')
    .replace(/\[[^\d]*?\]/g, '')
    .replace(/\s+0*(\d+)$/g, ' $1권')
    .replace(/\s+/g, ' ')
    .trim();

  if (!formattedTitle) formattedTitle = title.trim();

  const baseTitle = title
    .replace(/[\(\[\{].*?[\)\]\}]/g, '')
    .replace(/\s+\d+$/g, '')
    .trim();

  let searchQuery = author && author !== '-' ? `${formattedTitle} ${author}` : formattedTitle;
  let bookData = await fetchKakaoBookData(searchQuery);

  if ((!bookData || !bookData.thumbnail) && searchQuery !== formattedTitle) {
    bookData = await fetchKakaoBookData(formattedTitle);
  }

  if ((!bookData || !bookData.thumbnail) && baseTitle !== formattedTitle) {
    const fallbackData = await fetchKakaoBookData(baseTitle);
    if (fallbackData) {
      bookData = {
        thumbnail: bookData?.thumbnail || fallbackData.thumbnail,
        contents: bookData?.contents || fallbackData.contents
      };
    }
  }

  if (bookData && bookData.thumbnail) {
    imgEl.src = bookData.thumbnail;
    imgEl.onload = () => {
      loadingEl.style.display = 'none';
      imgEl.classList.add('loaded');
    };
  } else {
    loadingEl.innerText = '표지 이미지 없음';
  }

  if (bookData && bookData.contents) {
    summaryEl.innerText = bookData.contents;
  } else {
    summaryEl.innerText = '도서 소개 정보가 없습니다.';
  }
}
