<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서재 도서 검색</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--txt:#e8eaed;--sub:#98a1b3;--acc:#5b8cff;--acc2:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
header{position:sticky;top:0;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 16px 12px;z-index:10}
.wrap{max-width:980px;margin:0 auto}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:19px;letter-spacing:-.3px}
h1 span{color:var(--sub);font-size:13px;font-weight:400;margin-left:8px}
.tools{display:flex;gap:6px}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.ghost{color:var(--sub)}
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:220px;padding:12px 14px;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);outline:none}
input[type=search]:focus{border-color:var(--acc)}
select{padding:12px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;max-height:96px;overflow:auto}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;color:var(--sub);font-size:13px;text-align:center;margin-bottom:14px}
.drop.hot{border-color:var(--acc);color:var(--txt);background:#141a2b}
.src{font-size:12px;color:var(--sub);margin-bottom:10px}
.src b{color:var(--acc2)}
.stat{color:var(--sub);font-size:13px;margin:4px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;color:var(--sub);font-size:12px;font-weight:600;background:var(--bg)}
tr:hover td{background:#151923}
.loc{display:inline-block;padding:3px 9px;border-radius:6px;background:#1d2a1f;color:var(--acc2);font-weight:700;font-size:12px;letter-spacing:.5px}
mark{background:#3b4a7a;color:#fff;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--sub);padding:48px 0}
.more{display:block;width:100%;margin:16px 0 40px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e2432;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:560px){.hide-sm{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="titlerow">
  <h1>📚 서재 도서 검색<span id="total"></span></h1>
  <div class="tools">
    <button class="btn" id="upBtn">📤 CSV 업로드</button>
    <button class="btn ghost" id="resetBtn" hidden>↩ 기본 데이터로</button>
    <input type="file" id="file" accept=".csv,text/csv" hidden>
  </div>
</div>
<div class="searchbar">
  <input id="q" type="search" placeholder="도서명 · 저자 · 출판사 · 위치 검색 (예: 노다메, 대원씨아이, A1-A2)" autocomplete="off">
  <select id="field">
    <option value="all">전체</option><option value="0">도서명</option>
    <option value="1">저자</option><option value="2">출판사</option><option value="3">위치</option>
  </select>
  <select id="sort">
    <option value="loc">위치순</option><option value="title">도서명순</option><option value="author">저자순</option>
  </select>
</div>
<div class="chips" id="chips"></div>
</div></header>
<main>
  <div class="drop" id="drop">여기에 <b>.csv</b> 파일을 끌어다 놓으면 목록이 교체됩니다 · 헤더: <code>도서명,저자,출판사,위치</code></div>
  <div class="src" id="src"></div>
  <div class="stat" id="stat"></div>
  <table><thead><tr><th style="width:44%">도서명</th><th class="hide-sm">저자</th><th class="hide-sm">출판사</th><th style="width:90px">위치</th></tr></thead>
  <tbody id="rows"></tbody></table>
  <div class="empty" id="empty" hidden>검색 결과가 없습니다.</div>
  <button class="more" id="more" hidden>더 보기</button>
</main>
<div class="toast" id="toast"></div>

/* ---------- CSV 파서 (따옴표/줄바꿈 지원) ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c==="\r"){}
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function csvToData(text){
  const rows=parseCSV(text);
  if(!rows.length) throw new Error("빈 파일입니다.");
  let head=rows[0].map(s=>s.trim());
  const idx=n=>head.findIndex(h=>h===n);
  let map;
  if(idx("도서명")>=0){ map=[idx("도서명"),idx("저자"),idx("출판사"),idx("위치")]; rows.shift(); }
  else { map=[0,1,2,3]; }               // 헤더 없으면 순서대로
  if(map.some(i=>i<0)) throw new Error("헤더에 도서명/저자/출판사/위치 열이 필요합니다.");
  const out=rows.map(r=>map.map(i=>(r[i]||"").trim())).filter(r=>r[0]);
  if(!out.length) throw new Error("데이터 행이 없습니다.");
  return out;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2600); }

function loadData(arr,name,persist){
  DATA=arr; srcName=name;
  if(persist){ try{ localStorage.setItem(KEY,JSON.stringify({name:name,rows:arr})); }catch(e){ toast("용량 초과로 저장은 생략됩니다."); } }
  buildShelves(); render();
}
function buildShelves(){
  shelves=[...new Set(DATA.map(r=>r[3]).filter(Boolean))].sort();
  shelfFilter="";
  const chips=$("#chips"); chips.innerHTML="";
  const mk=(t,v)=>{const b=document.createElement("button");b.className="chip";b.textContent=t;b.onclick=()=>{shelfFilter=v;render();};chips.appendChild(b);};
  mk("전체",""); shelves.forEach(s=>mk(s,s));
  $("#total").textContent="총 "+DATA.length.toLocaleString()+"권 · "+shelves.length+"개 구역";
  $("#src").innerHTML="현재 데이터 출처: <b>"+srcName.replace(/[&<>]/g,"")+"</b>";
  $("#resetBtn").hidden = (srcName==="내장 데이터");
}

/* ---------- 업로드 ---------- */
function handleFile(f){
  if(!f) return;
  if(!/\.csv$/i.test(f.name)) { toast("CSV 파일만 업로드할 수 있습니다."); return; }
  const rd=new FileReader();
  rd.onload=e=>{ try{ const d=csvToData(e.target.result); loadData(d,f.name,true); toast("✅ "+f.name+" · "+d.length.toLocaleString()+"권 불러옴"); }
                 catch(err){ toast("⚠ "+err.message); } };
  rd.readAsText(f,"utf-8");
}
$("#upBtn").onclick=()=>$("#file").click();
$("#file").onchange=e=>{ handleFile(e.target.files[0]); e.target.value=""; };
$("#resetBtn").onclick=()=>{ localStorage.removeItem(KEY); loadData(BUILTIN,"내장 데이터",false); toast("기본 데이터로 되돌렸습니다."); };

["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hot");}));
drop.addEventListener("drop",e=>handleFile(e.dataTransfer.files[0]));
drop.addEventListener("click",()=>$("#file").click());

/* ---------- 검색/렌더 ---------- */
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/\s+/g,"");
function hl(text,q){ const t=esc(text); if(!q) return t;
  const i=t.toLowerCase().indexOf(q.toLowerCase());
  return i<0? t : t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length); }

function render(){
  const q=$("#q").value.trim(), f=$("#field").value, sort=$("#sort").value, nq=norm(q);
  result=DATA.filter(r=>{
    if(shelfFilter && r[3]!==shelfFilter) return false;
    if(!nq) return true;
    return f==="all" ? norm(r.join(" ")).includes(nq) : norm(r[+f]).includes(nq);
  });
  if(sort==="title") result=[...result].sort((a,b)=>a[0].localeCompare(b[0],"ko"));
  else if(sort==="author") result=[...result].sort((a,b)=>a[1].localeCompare(b[1],"ko")||a[0].localeCompare(b[0],"ko"));
  const locs=[...new Set(result.map(r=>r[3]))];
  $("#stat").textContent=result.length? result.length.toLocaleString()+"권 검색됨 · 위치: "+locs.join(", ") : "";
  $("#empty").hidden=result.length>0;
  $("#rows").innerHTML=""; shown=0;
  [...$("#chips").children].forEach((c,i)=>c.classList.toggle("on",(i===0?"":shelves[i-1])===shelfFilter));
  more();
}
function more(){
  const slice=result.slice(shown,shown+PAGE), q=$("#q").value.trim(), frag=document.createDocumentFragment();
  slice.forEach(r=>{ const tr=document.createElement("tr");
    tr.innerHTML="<td>"+hl(r[0],q)+"</td><td class='hide-sm'>"+hl(r[1],q)+"</td><td class='hide-sm'>"+hl(r[2],q)+"</td><td><span class='loc'>"+esc(r[3])+"</span></td>";
    frag.appendChild(tr); });
  $("#rows").appendChild(frag); shown+=slice.length;
  $("#more").hidden=shown>=result.length;
  $("#more").textContent="더 보기 ("+(result.length-shown)+"권 남음)";
}
["#q","#field","#sort"].forEach(s=>$(s).addEventListener("input",render));
$("#field").addEventListener("change",render); $("#sort").addEventListener("change",render);
$("#more").addEventListener("click",more);

       if(s&&s.rows&&s.rows.length){ loadData(s.rows,s.name+" (저장됨)",false); return; } }catch(e){}
  loadData(BUILTIN,"내장 데이터",false);

</script>
