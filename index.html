<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>만찾, 서만창 도서 검색 시스템</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--txt:#e8eaed;--sub:#98a1b3;--acc:#5b8cff;--acc2:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
header{position:sticky;top:0;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 16px 12px;z-index:10}
.wrap{max-width:980px;margin:0 auto}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:19px;letter-spacing:-.3px}
h1 span{color:var(--sub);font-size:13px;font-weight:400;margin-left:8px}
.tools{display:flex;gap:6px}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.ghost{color:var(--sub)}
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:220px;padding:12px 14px;font-size:15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);outline:none}
input[type=search]:focus{border-color:var(--acc)}
select{padding:12px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;max-height:96px;overflow:auto}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.src{font-size:12px;color:var(--sub);margin-bottom:10px}
.src b{color:var(--acc2)}
.stat{color:var(--sub);font-size:13px;margin:4px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;color:var(--sub);font-size:12px;font-weight:600;background:var(--bg)}
tr:hover td{background:#151923}
.loc{display:inline-block;padding:3px 9px;border-radius:6px;background:#1d2a1f;color:var(--acc2);font-weight:700;font-size:12px;letter-spacing:.5px}
mark{background:#3b4a7a;color:#fff;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--sub);padding:48px 0}
.more{display:block;width:100%;margin:16px 0 40px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e2432;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:560px){.hide-sm{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="titlerow">
  <h1>📚 만찾<span>서만창 도서 검색 시스템</span></h1>
  <div class="tools">
    <button class="btn" id="upBtn">데이터베이스 수동 업로드 (*.csv)</button>
    <button class="btn ghost" id="resetBtn" hidden>↩ 기본 데이터로</button>
    <input type="file" id="file" accept=".csv,text/csv" hidden>
  </div>
</div>
<div class="searchbar">
  <input id="q" type="search" placeholder="도서명 · 저자 · 출판사 · 위치 검색 (예: 노다메, 대원씨아이, A1-A2)" autocomplete="off">
  <select id="field">
    <option value="all">전체</option><option value="0">도서명</option>
    <option value="1">저자</option><option value="2">출판사</option><option value="3">위치</option>
  </select>
  <select id="sort">
    <option value="loc">위치순</option><option value="title">도서명순</option><option value="author">저자순</option>
  </select>
</div>
<div class="chips" id="chips"></div>
</div></header>
<main>
  <div class="src" id="src"></div>
  <div class="stat" id="stat"></div>
  <table><thead><tr><th style="width:44%">도서명</th><th class="hide-sm">저자</th><th class="hide-sm">출판사</th><th style="width:90px">위치</th></tr></thead>
  <tbody id="rows"></tbody></table>
  <div class="empty" id="empty" hidden>검색 결과가 없습니다.</div>
  <button class="more" id="more" hidden>더 보기</button>
</main>
<div class="toast" id="toast"></div>

<script>
let currentData = [];
let filteredData = [];
let displayCount = 50;
let activeChip = null;

// CSV 파서 함수 (큰따옴표 및 쉼표 예외 처리)
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) continue;
    
    const row = [];
    let insideQuote = false;
    let entry = '';
    
    for (let j = 0; j < line.length; j++) {
      const char = line[j];
      if (char === '"') {
        insideQuote = !insideQuote;
      } else if (char === ',' && !insideQuote) {
        row.push(entry.trim().replace(/^"|"$/g, ''));
        entry = '';
      } else {
        entry += char;
      }
    }
    row.push(entry.trim().replace(/^"|"$/g, ''));
    
    if (row.length >= 4) {
      result.push(row.slice(0, 4));
    }
  }
  return result;
}

// 외부 database.csv 로드
async function loadDefaultCSV() {
  try {
    const res = await fetch('database.csv');
    if (!res.ok) throw new Error('database.csv 로드 실패');
    const text = await res.text();
    currentData = parseCSV(text);
    document.getElementById('src').innerHTML = `데이터 출처: <b>기본 database.csv</b> (${currentData.length}건)`;
    document.getElementById('resetBtn').hidden = true;
    initChips();
    filterAndRender();
  } catch (err) {
    showToast('database.csv 파일을 찾을 수 없습니다.');
    document.getElementById('src').innerText = '데이터를 불러올 수 없습니다.';
  }
}

// 위치 칩(Chip) 생성
function initChips() {
  const locs = [...new Set(currentData.map(r => r[3]))].sort();
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = '';
  
  locs.forEach(loc => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.innerText = loc;
    chip.onclick = () => {
      if (activeChip === loc) {
        activeChip = null;
        chip.classList.remove('on');
      } else {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
        activeChip = loc;
        chip.classList.add('on');
      }
      filterAndRender();
    };
    chipsEl.appendChild(chip);
  });
}

// 토스트 메시지
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2500);
}

// 검색 및 정렬
function filterAndRender() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const field = document.getElementById('field').value;
  const sort = document.getElementById('sort').value;

  filteredData = currentData.filter(row => {
    if (activeChip && row[3] !== activeChip) return false;
    
    if (!q) return true;
    if (field === 'all') {
      return row.some(cell => cell.toLowerCase().includes(q));
    } else {
      const idx = parseInt(field, 10);
      return row[idx] && row[idx].toLowerCase().includes(q);
    }
  });

  filteredData.sort((a, b) => {
    if (sort === 'loc') return a[3].localeCompare(b[3], 'ko');
    if (sort === 'title') return a[0].localeCompare(b[0], 'ko');
    if (sort === 'author') return a[1].localeCompare(b[1], 'ko');
    return 0;
  });

  displayCount = 50;
  renderTable();
}

// 테이블 렌더링
function renderTable() {
  const rowsEl = document.getElementById('rows');
  const statEl = document.getElementById('stat');
  const emptyEl = document.getElementById('empty');
  const moreBtn = document.getElementById('more');
  const q = document.getElementById('q').value.trim();

  statEl.innerText = `검색 결과: ${filteredData.length}건`;

  if (filteredData.length === 0) {
    rowsEl.innerHTML = '';
    emptyEl.hidden = false;
    moreBtn.hidden = true;
    return;
  }

  emptyEl.hidden = true;
  const slice = filteredData.slice(0, displayCount);

  const highlight = (text) => {
    if (!q) return text;
    const reg = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(reg, '<mark>$1</mark>');
  };

  rowsEl.innerHTML = slice.map(row => `
    <tr>
      <td>${highlight(row[0])}</td>
      <td class="hide-sm">${highlight(row[1])}</td>
      <td class="hide-sm">${highlight(row[2])}</td>
      <td><span class="loc">${highlight(row[3])}</span></td>
    </tr>
  `).join('');

  moreBtn.hidden = displayCount >= filteredData.length;
}

// 이벤트 리스너 설정
document.getElementById('q').addEventListener('input', filterAndRender);
document.getElementById('field').addEventListener('change', filterAndRender);
document.getElementById('sort').addEventListener('change', filterAndRender);

document.getElementById('more').onclick = () => {
  displayCount += 50;
  renderTable();
};

// 상단 CSV 업로드 버튼
const fileInput = document.getElementById('file');
document.getElementById('upBtn').onclick = () => fileInput.click();

fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (evt) => {
    const text = evt.target.result;
    const parsed = parseCSV(text);
    if (parsed.length === 0) {
      showToast('CSV 형식이 올바르지 않거나 데이터가 없습니다.');
      return;
    }
    currentData = parsed;
    activeChip = null;
    document.getElementById('src').innerHTML = `데이터 출처: <b>${file.name}</b> (${currentData.length}건)`;
    document.getElementById('resetBtn').hidden = false;
    initChips();
    filterAndRender();
    showToast('CSV 파일이 적용되었습니다.');
  };
  reader.readAsText(file, 'UTF-8');
};

// 기본 데이터 복원 버튼
document.getElementById('resetBtn').onclick = () => {
  fileInput.value = '';
  activeChip = null;
  loadDefaultCSV();
  showToast('기본 CSV 데이터로 돌아왔습니다.');
};

// 페이지 로드 시 database.csv 자동 로드
loadDefaultCSV();
</script>
</body>
</html>
